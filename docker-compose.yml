version: '3.8'

services:
  echoex-node:
    image: echoex/node:latest
    restart: unless-stopped
    environment:
      - ECHOEX_TOKEN=${ECHOEX_TOKEN}
      - ECHOEX_CHAMBER=${ECHOEX_CHAMBER}
      - ECHOEX_NAME=${ECHOEX_NAME:-Echoex Node}
      - ECHOEX_HOST=${ECHOEX_HOST:-bulkmetadataeditor.com}
